name: voice_to_text
description: "Dictator — offline macOS dictation (Gemma or Whisper STT + optional grammar)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Menu bar tray
  tray_manager: ^0.5.2
  window_manager: ^0.4.3

  # Global hotkeys
  hotkey_manager: ^0.2.3

  # Audio recording
  record: ^6.0.0

  # On-device Gemma inference
  flutter_gemma: ^0.16.2

  # Settings persistence
  shared_preferences: ^2.3.0

  # File paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Icons
  cupertino_icons: ^1.0.8
  whisper_ggml: ^1.7.0
  sherpa_onnx: ^1.13.2
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon_recording.png
    - assets/tray_icon_transcribing.png
